<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyclomind</title>
  <link rel="stylesheet" href="styles.css?v=20260917g">
  <script src="src/game.js?v=20260917g" defer></script>
</head>

<body>
  <main class="app">
    <section class="play-area" aria-labelledby="title">
      <button id="settings-button" class="corner-button settings-button" type="button" aria-expanded="false"
        aria-controls="settings-panel" aria-label="Settings"><span aria-hidden="true">&#9881;&#xFE0E;</span></button>
      <button id="info-button" class="info-button" type="button" aria-expanded="false" aria-controls="info-panel"
        aria-label="How to play">i</button>
      <button id="new-button" class="corner-button new-button" type="button" aria-label="New game" title="New game">+</button>

      <aside id="settings-panel" class="settings-panel" hidden>
        <h2>Settings</h2>
        <form id="settings-form">
          <label>
            <span>Positions</span>
            <select id="position-count-select" name="position-count">
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </label>
          <label>
            <span>Colours (max)</span>
            <select id="color-count-select" name="color-count">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </label>
          <label class="settings-checkbox-row">
            <input id="show-numbers-checkbox" type="checkbox">
            <span>Show colour numbers</span>
          </label>
          <button class="tool-button settings-apply-button" type="submit">Apply</button>
        </form>
      </aside>

      <aside id="info-panel" class="info-panel" hidden>
        <h2>How to play</h2>
        <ul id="how-to-play-list"></ul>
      </aside>

      <header class="title-block">
        <h1 id="title">Cyclomind</h1>
        <p id="status" class="status" aria-live="polite"></p>
      </header>

      <div class="board-block">
        <svg id="board" class="board" viewBox="0 0 220 220" role="group" aria-label="Necklace of beads"></svg>

        <div class="toolbar" aria-label="Game controls">
          <button id="submit-button" class="tool-button" type="button">Guess</button>
        </div>
      </div>

      <section class="selection-panel" aria-label="Previous guesses">
        <div id="history" class="selection-lines"></div>
      </section>
    </section>
  </main>
</body>

</html>
